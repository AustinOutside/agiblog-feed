name: Build agi.blog feeds

on:
  schedule:
    # Watchdog only. GitHub was dropping this repo's "*/30 * * * *" runs and
    # creating one every 4–6 hours; those runs start immediately, so the gap
    # is skipped schedules rather than queue delay. Off :00/:30 in case the
    # slot is ever the problem. The rearm job is the 30-minute clock.
    - cron: "7,37 * * * *"
    - cron: "19,49 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write   # weekly keepalive commit (scheduled workflows stop after 60 days without repo activity)
  pages: write
  id-token: write
  actions: write    # rearm dispatches the next run with the built-in token

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level so the rearm sleep does not block a manual run or the next publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feeds.json
        env:
          OUT_DIR: public
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feeds.json
        run: |
          python build.py
          python -c 'import json; print("generated", json.load(open("public/feeds.json"))["generated"])'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Weekly keepalive commit
        if: github.event_name == 'schedule'
        run: |
          last=$(cat keepalive.txt 2>/dev/null || echo 1970-01-01T00:00:00Z)
          if [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -gt 604800 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keepalive" && git push
          fi

  rearm:
    name: Schedule next build
    needs: build
    # A failed fetch should still arm the next attempt. A cancelled run should not.
    if: "${{ always() && !cancelled() && needs.build.result != 'cancelled' && needs.build.result != 'skipped' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A newer publish cancels this wait and arms the next run itself.
    concurrency:
      group: feed-rearm
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait, then dispatch the next build
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feeds.json
          RUN_ID: ${{ github.run_id }}
          INTERVAL: "1800"
        run: bash rearm.sh
