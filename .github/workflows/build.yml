name: Build agi.blog feeds

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write   # weekly keepalive commit (scheduled workflows stop after 60 days without repo activity)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feeds.json
        env:
          OUT_DIR: public
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feeds.json
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Weekly keepalive commit
        if: github.event_name == 'schedule'
        run: |
          last=$(cat keepalive.txt 2>/dev/null || echo 1970-01-01T00:00:00Z)
          if [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -gt 604800 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keepalive" && git push
          fi
