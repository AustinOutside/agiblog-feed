name: Build agi.blog feeds

on:
  schedule:
    # Watchdog only. GitHub was dropping this repo's "*/30 * * * *" runs and
    # creating one every 4–6 hours; those runs start immediately, so the gap
    # is skipped schedules rather than queue delay. Off :00/:30 in case the
    # slot is ever the problem. The rearm workflow is the 30-minute clock.
    - cron: "7,37 * * * *"
    - cron: "19,49 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write   # weekly keepalive commit (scheduled workflows stop after 60 days without repo activity)
  pages: write
  id-token: write

# One Pages deploy at a time. An overlapping run waits instead of failing
# deploy-pages on the shared github-pages artifact. cancel-in-progress is
# false so a deploy already running is not aborted. The default queue keeps
# a single pending run. The 30-minute sleep lives in rearm.yml so this run
# ends after deploy and does not keep the artifact name locked.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feeds.json
        env:
          OUT_DIR: public
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feeds.json
        run: |
          python build.py
          python -c 'import json; print("generated", json.load(open("public/feeds.json"))["generated"])'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      # deploy-pages lists artifacts once. The list is often empty for a
      # fraction of a second after upload, and it stays empty while another
      # run of this workflow is still in progress. Retry only that miss.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 10
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 20
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Weekly keepalive commit
        if: github.event_name == 'schedule' && (steps.deploy.outcome == 'success' || steps.deploy2.outcome == 'success' || steps.deploy3.outcome == 'success')
        run: |
          last=$(cat keepalive.txt 2>/dev/null || echo 1970-01-01T00:00:00Z)
          if [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -gt 604800 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > keepalive.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keepalive" && git push
          fi
