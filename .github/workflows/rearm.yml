name: Schedule next build

on:
  workflow_run:
    workflows: ["Build agi.blog feeds"]
    types: [completed]

permissions:
  contents: read
  actions: write    # dispatch the next build with the built-in token

# Separate from the Pages workflow. Sleeping here must not keep a
# github-pages artifact run in progress, and a newer build replaces this wait.
concurrency:
  group: feed-rearm
  cancel-in-progress: true

jobs:
  rearm:
    # A failed fetch should still arm the next attempt. A cancelled run should not.
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Wait, then dispatch the next build
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feeds.json
          RUN_ID: ${{ github.event.workflow_run.id }}
          INTERVAL: "1800"
          WORKFLOW: build.yml
          REF: main
        run: bash rearm.sh
