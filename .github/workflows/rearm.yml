name: Schedule next build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run that armed this wait
        required: false
        default: "0"

permissions:
  contents: read
  actions: write    # dispatch the next build with the built-in token

# A newer build replaces this wait. Every run of this workflow executes the
# job. The previous workflow_run pair did not: cancel-in-progress stopped the
# run that would have waited, and the survivor was skipped.
concurrency:
  group: feed-rearm
  cancel-in-progress: true

jobs:
  rearm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Wait, then dispatch the next build
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feeds.json
          RUN_ID: ${{ inputs.run_id || '0' }}
          INTERVAL: "1800"
          WORKFLOW: build.yml
          REF: main
        run: bash rearm.sh
